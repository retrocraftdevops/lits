openapi: 3.1.0
info:
  title: LITS — Livestock Identification & Traceability System
  version: 2.2.0
  summary: Vendor-neutral national livestock registry API (the source of truth).
  description: |
    LITS is the national registry of record for livestock **identity**, **movement**
    and **animal-health** events in Zimbabwe. It is a standalone, vendor-neutral
    service: any farm-management platform (FuroTrack and others), abattoir, auction
    house or veterinary district office integrates as a **client**. The registry — not
    any one vendor — is the source of truth.

    Authority to operate LITS is conferred by the Department of Veterinary Services
    (DVS) under the **Animal Health Act [Chapter 19:01]**; personal data is held under
    the **Cyber & Data Protection Act [Chapter 12:07]** (regulator: POTRAZ).

    STATUS: DRAFT CONTRACT. No production endpoint exists yet. This document is the
    contract that both the registry implementation and every client integration build
    against. Hosts below are placeholders on an operator/State domain — never a vendor
    domain.

    Scope: cattle first (aligned with the National Cattle Identification Program),
    designed to extend to small stock.

    ## Scopes (v2.0.0)

    Authorisation is **key-bound**: every elevated endpoint is gated by a scope carried on the
    operator's API key, granted by the registry operator (DVS) at key-issue time. A key issued with
    no explicit scope list (the default) keeps full access so existing integrations never regress; a
    restricted third-party key (e.g. an export integrator like METS) is issued with exactly the
    scopes it has been authorised for. The server returns `403 insufficient_scope` when the key lacks
    the required scope — a client cannot self-elevate.

    Standard integrator endpoints (`/animals`, `/movements`, `/vaccinations`, `/certificates`,
    `/zones`, `/quarantine-orders`, `/campaigns`, `/disease-cases`, `/lab-results`) need no
    special scope. `/quarantine-orders` is deliberately in that list: an order the client cannot
    read is an order the client cannot enforce, and a restriction that only privileged keys can
    see does not stop a truck. Elevated scopes:

    | Scope | Endpoint |
    |---|---|
    | `movements:read` | `GET /animals/{id}/movements` |
    | `holdings:read` | `GET /holdings/{id}` |
    | `health:read` | `GET /animals/{id}/health` |
    | `disease_cases:write` | `PATCH /disease-cases/{id}` |

    A client MAY additionally send `X-LITS-Scope: elevated` to declare intent, but it is advisory —
    the key's granted scopes are authoritative. Apply for elevated scope via the registry operator.
  contact:
    name: LITS registry operator (TBD — DVS / delegated operator)
  license:
    name: To be set by the operator/State
servers:
  - url: https://api.example.gov/v1
    description: Production (operator-owned; placeholder host)
  - url: https://sandbox.example.gov/v1
    description: Sandbox for client integration testing

security:
  - operatorApiKey: []

tags:
  - name: animals
    description: Identity registration and lookup.
  - name: keepers
    description: Keeper identity resolution (find-or-claim on a natural key — one keeper per person).
  - name: keeper-self
    description: |
      Keeper self-service ("keeper self-service") — a livestock owner managing their OWN herd, movements
      and certificate requests directly, with no vendor. Owner-scoped, `keeperSession` auth.
  - name: movements
    description: Movement permits / consignment records.
  - name: vaccinations
    description: Vaccination and mandatory disease events.
  - name: campaigns
    description: |
      Active national vaccination campaigns (e.g. an FMD ring-vaccination during an outbreak),
      published by the registry so a client can surface them to keepers and field officers and
      report coverage back via `POST /vaccinations`.
  - name: zones
    description: Veterinary / FMD zone reference data (delta sync).
  - name: orders
    description: |
      Disease response orders — quarantine and standstill (delta sync). **Read-only on this
      plane.** An order is an act of the State: it is authored on the control plane by a
      veterinary officer, and a client never mints one. What a client does is read the order and
      obey it.
  - name: holdings
    description: |
      Holding (premises) detail with geolocation and EUDR compliance flags. Elevated scope required
      (`holdings:read`). Operators (e.g. METS) use this to retrieve holding coordinates for EUDR
      Due Diligence Statements.
  - name: disease
    description: |
      Disease case reporting and surveillance. Integrators (field apps, abattoir systems, FuroTrack)
      POST suspect disease observations; the registry aggregates them for the national epidemiology
      register. Classification and outcome updates require `disease_cases:write` scope.
  - name: labs
    description: |
      Laboratory result submission. Accredited integrators (LIMS connectors, FuroTrack) POST
      confirmed lab results; the registry auto-links positives to notifiable disease cases.
  - name: certificates
    description: Issue, fetch and revoke registry-signed certificates (movement permit, health, export).
  - name: verification
    description: Public, unauthenticated certificate/animal verification.
  - name: system
    description: Discovery and liveness.

paths:
  /animals:
    post:
      tags: [animals]
      operationId: registerAnimal
      summary: Register / identify an animal
      description: |
        Registers an animal in the national herd and returns its official
        `national_id`. The registry assigns this ID from its Postgres-backed sequence; clients
        must not send a final `national_id` on normal registration. If the submitted animal
        already exists by physical tag/device or by the `Idempotency-Key`, the existing record is
        returned unchanged. Local/vendor identifiers belong in `external_references`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalRegistration' }
            examples:
              cattle:
                $ref: '#/components/examples/AnimalRegistrationExample'
      responses:
        '201':
          description: Animal registered (or already present — idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /animals/{national_id}:
    get:
      tags: [animals]
      operationId: getAnimal
      summary: Look up an animal by national ID
      parameters:
        - name: national_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Animal record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /animals/by-tag:
    get:
      tags: [animals]
      operationId: lookupByTag
      summary: Resolve a physical tag (eid or visual tag) to its animal — incl. a retired tag
      description: A retired/replaced tag still resolves to the live animal (tag_retired = true).
      parameters:
        - { name: tag, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Animal (plus matched_tag and tag_retired)., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /authorized-keepers:
    get:
      tags: [keepers]
      operationId: authorizedKeepers
      summary: Keepers who currently authorize the calling integrator (the consented herd scope)
      responses:
        '200': { description: Keeper ids., content: { application/json: { schema: { type: object, properties: { count: { type: integer }, keeper_ids: { type: array, items: { type: string } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /keepers/resolve:
    post:
      tags: [keepers]
      operationId: resolveKeeper
      summary: Find-or-claim a keeper by natural key
      description: |
        Resolves a person to the single registry keeper record, keyed on a sovereign natural
        key (`national_id_no` and/or verified `msisdn`). Returns the existing keeper when the
        person is already known — so an integrator never creates a second keeper for someone the
        keeper app or another vendor already onboarded — otherwise creates and returns a new one.
        `outcome` is `matched` or `created`. This is entity-level identity resolution, distinct
        from the request-level `Idempotency-Key` (which only makes a single retried call safe).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeeperResolve' }
      responses:
        '200':
          description: The resolved keeper (matched or created).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keeper' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /animals/{national_id}/movements:
    get:
      tags: [animals]
      operationId: getAnimalMovements
      summary: Ordered movement history for one animal (elevated scope — movements:read)
      description: |
        Returns every movement step the animal has been part of, in chronological order.
        Intended for export/traceability integrators (METS, EUDR systems) that need
        the holding provenance chain before processing a carcass.

        Requires the key scope `movements:read` (operator-granted).
      parameters:
        - name: national_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ordered movement steps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalMovementHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Elevated scope not granted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /animals/{national_id}/health:
    get:
      tags: [animals]
      operationId: getAnimalHealth
      summary: Health status snapshot for one animal (elevated scope — health:read)
      description: |
        Returns the current veterinary zone, disease-free indicator (no active notifiable
        disease cases in the last 60 days), most recent vaccination per disease, and latest
        lab result. Used by METS emission modules (CBT, China dossier) at abattoir intake.

        Requires the key scope `health:read` (operator-granted).
      parameters:
        - name: national_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Health status snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalHealthStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Elevated scope not granted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /holdings/{holding_id}:
    get:
      tags: [holdings]
      operationId: getHolding
      summary: Holding detail with geolocation and EUDR compliance flags (elevated scope — holdings:read)
      description: |
        Returns premises detail including GPS coordinates and the EUDR flags
        (`deforestation_free`, `legality_verified`) set by the DVS-authorised administrator.
        Used by METS to assemble EUDR Due Diligence Statement geosets when live lookup
        is preferred over frozen evidence snapshots.

        Requires the key scope `holdings:read` (operator-granted).
      parameters:
        - name: holding_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Holding detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Elevated scope not granted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /movements:
    post:
      tags: [movements]
      operationId: recordMovement
      summary: Lodge a movement permit / consignment
      description: |
        Records a livestock movement (one truck departure may carry many animals).
        Returns a `permit_reference`. The registry enforces veterinary-zone rules and
        may reject a movement that crosses a blocked boundary.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Movement' }
            examples:
              consignment:
                $ref: '#/components/examples/MovementExample'
      responses:
        '201':
          description: Movement recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Movement blocked by a zone restriction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /movements/list:
    get:
      tags: [movements]
      operationId: listMovements
      summary: List movement permits by status and time window (for integrator poll / auto-sync)
      description: |
        Returns permits matching the given `status` that were last updated after `since`.
        Integrators (e.g. FuroTrack) poll this endpoint to detect permits that have
        transitioned to `approved` in the registry since their last sync, then push
        the corresponding field data automatically rather than waiting for a manual trigger.

        Items are `MovementPermitSummary`, which carries the **full lifecycle vocabulary**
        (`MovementLifecycleStatus`). This is a **read view of the permit as the authority has
        driven it** — it is not, and is not shaped like, an acknowledgement of a lodgement.
        A `POST /movements` acknowledgement (`MovementAck`) can still only ever be `lodged` or
        `blocked`, because a client lodges and only the authority approves.

        Sample response: `examples/movement-list.response.json`.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Filter by lifecycle status. Deliberately the same vocabulary the response carries:
            a status the registry can return is a status a client can ask for.
          schema: { $ref: '#/components/schemas/MovementLifecycleStatus' }
        - name: since
          in: query
          required: false
          description: ISO 8601 datetime — return permits updated after this timestamp.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        '200':
          description: Movement permit list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /disease-cases:
    post:
      tags: [disease]
      operationId: reportDiseaseCase
      summary: Report a suspect or confirmed disease case (passive / active surveillance)
      description: |
        Any accredited integrator (field app, FuroTrack, abattoir LIMS) may submit a
        disease observation. The registry records it at the submitted `classification`
        (`suspect` is the correct initial value for field-entered observations). A
        veterinary authority may reclassify via `PATCH /disease-cases/{id}`.

        The standard idempotency guarantee applies: a repeated `Idempotency-Key` returns
        the original record without creating a duplicate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiseaseCaseReport' }
            examples:
              fmdSuspect:
                $ref: '#/components/examples/DiseaseCaseReportExample'
      responses:
        '201':
          description: Disease case recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseCaseAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /disease-cases/{id}:
    get:
      tags: [disease]
      operationId: getDiseaseCase
      summary: Fetch a disease case (integrator read-back — own submissions only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Disease case detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseCaseDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [disease]
      operationId: updateDiseaseCase
      summary: Update classification or outcome (elevated scope — disease_cases:write)
      description: |
        A veterinary authority reclassifies a case (e.g. `suspect` → `confirmed`) or
        records an outcome (e.g. `under_treatment` → `recovered`). `vet_reg_no` is
        required to establish authority accountability.

        Requires the key scope `disease_cases:write` (operator-granted).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiseaseCaseUpdate' }
      responses:
        '200':
          description: Updated case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseCaseDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Elevated scope not granted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /lab-results:
    post:
      tags: [labs]
      operationId: recordLabResult
      summary: Submit a laboratory result for a notifiable disease test
      description: |
        Accredited LIMS connectors and field systems (FuroTrack) POST laboratory results
        against a specific animal (`national_id`). The registry automatically links a
        positive result for a notifiable disease to an existing open disease case (by
        holding and disease) or creates a new `confirmed` case if none exists.

        The standard idempotency guarantee applies.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabResultReport' }
            examples:
              fmdPositive:
                $ref: '#/components/examples/LabResultReportExample'
      responses:
        '201':
          description: Lab result recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabResultAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Animal not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /vaccinations:
    post:
      tags: [vaccinations]
      operationId: recordVaccination
      summary: Record a vaccination / mandatory disease event
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vaccination' }
            examples:
              fmd:
                $ref: '#/components/examples/VaccinationExample'
      responses:
        '201':
          description: Vaccination recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaccinationAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /certificates:
    post:
      tags: [certificates]
      operationId: requestCertificate
      summary: Request a certificate (delegated approval)
      description: |
        Integrators may only REQUEST a certificate. The registry records it with status
        `requested` (unsigned). Only the competent authority (Official Vet / DVS) issues and
        signs it (control plane) and revokes it — integrators never mint national certificates.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateRequest' }
            examples:
              movementPermit:
                $ref: '#/components/examples/CertificateRequestExample'
      responses:
        '201':
          description: Certificate request recorded (status 'requested').
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /certificates/{id}:
    get:
      tags: [certificates]
      operationId: getCertificate
      summary: Fetch a certificate (signed payload + PDF link)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Certificate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones:
    get:
      tags: [zones]
      operationId: getZones
      summary: Veterinary / FMD zone reference data (delta sync)
      description: |
        Returns zones whose `zone_version` is greater than `since_version`, plus the
        current `server_version`. Clients persist `server_version` and pass it back on
        the next call for an incremental delta. This shape matches FuroTrack's existing
        `fmd_zone_sync` consumer so it can ingest the feed unchanged.
      parameters:
        - name: since_version
          in: query
          required: false
          schema: { type: integer, format: int64, default: 0 }
        - name: country_code
          in: query
          required: false
          schema: { type: string, default: ZW }
      responses:
        '200':
          description: Zone delta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneDelta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /quarantine-orders:
    get:
      tags: [orders]
      operationId: getQuarantineOrders
      summary: Disease response orders — quarantine & standstill (delta sync)
      description: |
        Returns orders whose `order_version` is greater than `since_version`, plus the current
        `server_version`. Clients persist `server_version` and pass it back on the next call for
        an incremental delta.

        **This is `/zones`'s shape, field for field, and that is deliberate.** The consuming
        device is a phone in a district with intermittent connectivity: it must sync a small
        delta when it can and then enforce **offline**, and a monotonic integer is the only
        cursor that survives that honestly. Every deployed consumer already has code for this
        shape.

        **A lifted or revoked order stays in the feed**, carrying that `status`, rather than
        disappearing from it. A feed that answers "what changed" by omission cannot tell a client
        the difference between "lifted" and "you have not synced recently", and the client would
        keep enforcing a lifted order forever. Retraction is a positive statement.

        **A standstill order is also projected into `GET /v1/zones`** as a zone with
        `zone_type: standstill` and `movement_restriction: blocked`. A client that has never
        heard of this endpoint therefore enforces a national standstill on its next zone sync,
        with no client change — which is the point, because outbreak response is measured in
        hours and a coordinated release across every accredited vendor is measured in weeks. The
        order is the record and the zone is the view; `projected_zone_code` names the zone, so a
        client reading both feeds joins them instead of counting one restriction twice.
      parameters:
        - name: since_version
          in: query
          required: false
          schema: { type: integer, format: int64, default: 0 }
        - name: country_code
          in: query
          required: false
          schema: { type: string, default: ZW }
        - name: limit
          in: query
          required: false
          description: Maximum orders to return in one page. The cursor is `since_version`, not an offset.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Order delta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuarantineOrderDelta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /campaigns:
    get:
      tags: [campaigns]
      operationId: getCampaigns
      summary: Active national vaccination campaigns
      description: |
        Returns the registry's currently active vaccination campaigns (e.g. an FMD
        ring-vaccination during an outbreak), so an accredited client can surface them to
        keepers and field officers and report coverage back via `POST /vaccinations`.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, planned, completed], default: active }
        - name: country_code
          in: query
          required: false
          schema: { type: string, default: ZW }
      responses:
        '200':
          description: Active campaigns.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /verify/{token}:
    get:
      tags: [verification]
      operationId: verify
      summary: Public verification of an animal/certificate
      description: |
        Unauthenticated lookup behind a QR/print token. Returns a sanitised,
        non-sensitive status so a buyer, abattoir or inspector can verify provenance
        offline of any vendor.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trust-list:
    get:
      tags: [verification]
      operationId: trustList
      summary: National Trusted List (qualified e-seal trust anchor + seal certificates)
      description: |
        The signed national Trusted List (EU LOTL-equivalent): the trust anchor, the active and
        superseded qualified seal certificates, the time-stamp authority, and the seal-revocation
        list. An importing authority pins this once, then verifies every qualified e-seal it is
        presented **fully offline** — no call-back to the issuing registry.
      security: []
      responses:
        '200':
          description: The signed Trusted List.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /seals/verify:
    post:
      tags: [verification]
      operationId: verifySeal
      summary: Validate a presented qualified e-seal (ETSI TS 119 102-1 report)
      description: |
        Validate a presented qualified electronic seal and return an ETSI TS 119 102-1 validation
        report. Accepts a certificate object carrying a `seal`, or an explicit `{ seal, core }` pair
        (an eCert exposes these as `qualified_seal` + `signed_core`). Verification is offline against
        the Trusted List: it checks the issuer signature, the chain to the national trust anchor, the
        qualified timestamp, seal-certificate revocation and validity. Altering any sealed field
        yields `TOTAL_FAILED` / `SIG_CRYPTO_FAILURE`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seal: { $ref: '#/components/schemas/QualifiedSeal' }
                core: { type: object, description: The canonical signed payload the seal covers. }
      responses:
        '200':
          description: Validation report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SealValidationReport' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---- keeper self-service ("keeper self-service") — keeperSession auth, owner-scoped --------------
  /keeper/claim:
    post:
      tags: [keeper-self]
      operationId: keeperClaim
      summary: Onboard a keeper (find-or-claim by natural key) and start a session
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                msisdn: { type: string }
                national_id_no: { type: string }
      responses:
        '201':
          description: The keeper (created or matched); a `keeper_session` session cookie is set.
          content: { application/json: { schema: { $ref: '#/components/schemas/Keeper' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /keeper/login:
    post:
      tags: [keeper-self]
      operationId: keeperLogin
      summary: Sign in to an existing keeper record (match only; never creates)
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keeper_id: { type: string }
                msisdn: { type: string }
                national_id_no: { type: string }
      responses:
        '200': { description: Signed in., content: { application/json: { schema: { $ref: '#/components/schemas/Keeper' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/logout:
    post:
      tags: [keeper-self]
      operationId: keeperLogout
      summary: End the keeper session
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Signed out. }
  /keeper/otp/start:
    post:
      tags: [keeper-self]
      operationId: keeperOtpStart
      summary: Sign-in step 1 — send a one-time code to a mobile number
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [msisdn], properties: { msisdn: { type: string } } } } }
      responses:
        '200': { description: Code sent (dev_code in dev only; exists flags returning vs new)., content: { application/json: { schema: { type: object, properties: { sent: { type: boolean }, exists: { type: boolean }, dev_code: { type: [string, 'null'] } } } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /keeper/otp/verify:
    post:
      tags: [keeper-self]
      operationId: keeperOtpVerify
      summary: Sign-in step 2 — confirm the code (signs in or registers; mobile proven → verified)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [msisdn, code], properties: { msisdn: { type: string }, code: { type: string }, name: { type: string } } } } }
      responses:
        '200': { description: Signed in; a keeper_session session cookie is set., content: { application/json: { schema: { $ref: '#/components/schemas/Keeper' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /keeper/me:
    get:
      tags: [keeper-self]
      operationId: keeperMe
      summary: The signed-in keeper
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Keeper., content: { application/json: { schema: { $ref: '#/components/schemas/Keeper' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/verify/start:
    post:
      tags: [keeper-self]
      operationId: keeperVerifyStart
      summary: Send a one-time code to the keeper's mobile (claimed → verified)
      security: [{ keeperSession: [] }]
      responses:
        '200':
          description: Code sent. (`dev_code` is returned in dev only; production SMSes it.)
          content: { application/json: { schema: { type: object, properties: { sent: { type: boolean }, dev_code: { type: [string, 'null'] } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/verify/confirm:
    post:
      tags: [keeper-self]
      operationId: keeperVerifyConfirm
      summary: Confirm the one-time code (sets verification = verified)
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: Verified., content: { application/json: { schema: { type: object, properties: { verification: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/summary:
    get:
      tags: [keeper-self]
      operationId: keeperSummary
      summary: At-a-glance overview (counts + attention items) for the keeper home
      security: [{ keeperSession: [] }]
      responses:
        '200':
          description: Overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdings: { type: integer }
                  herd: { type: integer }
                  movements: { type: object }
                  certificates: { type: object }
                  attention:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, label: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/herd:
    get:
      tags: [keeper-self]
      operationId: keeperHerd
      summary: The keeper's own animals (owner-scoped)
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Herd., content: { application/json: { schema: { type: object, properties: { count: { type: integer }, animals: { type: array, items: { $ref: '#/components/schemas/AnimalRecord' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/scans:
    post:
      tags: [keeper-self]
      operationId: keeperScanForRegistration
      summary: Scan a tag/device as keeper registration evidence
      description: |
        Records a self-report scan and resolves the tag if it already exists. Unknown tags return
        a registration_hint that the keeper app can use to prefill animal registration. This does
        not confirm ownership, retagging, movement arrival, inspection, or disease status.
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                raw_tag: { type: string }
                visual_tag: { type: string }
                eid: { type: string }
                tag_type: { type: string, enum: [visual, eid], default: visual }
                reader_type: { type: string, default: manual }
                holding_id: { type: string }
                lat: { type: number }
                lng: { type: number }
                gps_accuracy_m: { type: number }
                device_id: { type: string }
                app_version: { type: string }
                captured_at: { type: string, format: date-time }
      responses:
        '201':
          description: Scan recorded; tag either matched an owned animal or can prefill registration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unknown_tag, matched_owned] }
                  scan: { type: object, additionalProperties: true }
                  animal: { $ref: '#/components/schemas/AnimalRecord' }
                  registration_hint: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /keeper/holdings:
    get:
      tags: [keeper-self]
      operationId: keeperHoldings
      summary: The keeper's own holdings
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Holdings., content: { application/json: { schema: { type: object, properties: { count: { type: integer }, holdings: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [keeper-self]
      operationId: keeperRegisterHolding
      summary: Register one of the keeper's own premises
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, district, province], properties: { name: { type: string }, district: { type: string }, province: { type: string } } } } }
      responses:
        '201': { description: Holding registered., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/animals:
    post:
      tags: [keeper-self]
      operationId: keeperCaptureAnimal
      summary: Capture (register) an animal into the keeper's own herd
      description: The server forces ownership to the signed-in keeper and assigns the national_id (find-or-create on tag).
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sex]
              properties:
                species: { type: string }
                sex: { type: string, enum: [male, female] }
                visual_tag: { type: string }
                eid: { type: string }
                breed: { type: string }
                date_of_birth: { type: string, format: date }
                holding_id: { type: string }
      responses:
        '201': { description: Registered (or matched by tag)., content: { application/json: { schema: { $ref: '#/components/schemas/AnimalAck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /keeper/animals/{national_id}:
    patch:
      tags: [keeper-self]
      operationId: keeperUpdateAnimal
      summary: Correct one of the keeper's own animals (owner-scoped)
      security: [{ keeperSession: [] }]
      parameters: [{ name: national_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                breed: { type: string }
                sex: { type: string }
                date_of_birth: { type: string, format: date }
                holding_id: { type: string }
                status: { type: string, enum: [active, dead, slaughtered, lost] }
      responses:
        '200': { description: Updated animal., content: { application/json: { schema: { $ref: '#/components/schemas/AnimalRecord' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /keeper/animals/{national_id}/retag:
    post:
      tags: [keeper-self]
      operationId: keeperRequestRetag
      summary: Request a tag replacement (§9.5 — the national_id never changes; authority confirms)
      security: [{ keeperSession: [] }]
      parameters: [{ name: national_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { new_visual_tag: { type: string }, new_eid: { type: string }, reason: { type: string } } } } }
      responses:
        '201': { description: Retag requested (status `pending`)., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /keeper/retags:
    get:
      tags: [keeper-self]
      operationId: keeperRetags
      summary: The keeper's tag-replacement requests and their status
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Retag requests., content: { application/json: { schema: { type: object, properties: { count: { type: integer }, retags: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/movements:
    get:
      tags: [keeper-self]
      operationId: keeperMovements
      summary: The keeper's own movement permits
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Permits., content: { application/json: { schema: { type: object, properties: { count: { type: integer }, movements: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [keeper-self]
      operationId: keeperLodgeMovement
      summary: Lodge a movement permit for the keeper's own animals (zone-enforced; vet approves)
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animal_ids, origin, destination]
              properties:
                animal_ids: { type: array, items: { type: string } }
                origin: { type: string }
                destination: { type: string }
                purpose: { type: string }
                origin_zone_code: { type: string }
                destination_zone_code: { type: string }
                destination_type: { type: string }
      responses:
        '201': { description: Lodged (or blocked by a zone rule)., content: { application/json: { schema: { $ref: '#/components/schemas/MovementAck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Unauthorized' }
  /keeper/certificates:
    get:
      tags: [keeper-self]
      operationId: keeperCerts
      summary: Certificates for the keeper's own animals
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Certificates., content: { application/json: { schema: { type: object, properties: { count: { type: integer }, certificates: { type: array, items: { $ref: '#/components/schemas/Certificate' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [keeper-self]
      operationId: keeperRequestCert
      summary: Request a certificate for one of the keeper's own animals (request-only)
      description: The authority issues & signs (Part I/II); the keeper never mints a certificate.
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: string }
                kind: { type: string, enum: [health, movement_permit, export] }
                destination: { type: string }
                valid_until: { type: string, format: date }
      responses:
        '201': { description: Certificate requested (status `requested`)., content: { application/json: { schema: { $ref: '#/components/schemas/Certificate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /keeper/integrators:
    get:
      tags: [keeper-self]
      operationId: keeperIntegrators
      summary: Accredited vendors the keeper can authorize
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Vendors., content: { application/json: { schema: { type: object, properties: { integrators: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keeper/authorizations:
    get:
      tags: [keeper-self]
      operationId: keeperAuthorizations
      summary: The keeper's vendor-access grants (consent / portability)
      security: [{ keeperSession: [] }]
      responses:
        '200': { description: Grants., content: { application/json: { schema: { type: object, properties: { count: { type: integer }, authorizations: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [keeper-self]
      operationId: keeperGrantAccess
      summary: Grant a vendor access to the keeper's herd (idempotent)
      security: [{ keeperSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [integrator_id], properties: { integrator_id: { type: string }, scope: { type: string } } } } }
      responses:
        '201': { description: Granted., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /keeper/authorizations/{id}:
    delete:
      tags: [keeper-self]
      operationId: keeperRevokeAccess
      summary: Revoke a vendor's access (the vendor-switch primitive)
      security: [{ keeperSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Revoked., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                required: [status]

components:
  securitySchemes:
    operatorApiKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Per-operator API key. Every integrated platform (FuroTrack, competitor apps,
        abattoir systems) is issued its own key so the registry attributes every
        submission to a known operator.
    keeperSession:
      type: apiKey
      in: cookie
      name: keeper_session
      description: |
        Keeper self-service session ("keeper self-service"). A SEPARATE, low-trust plane from the
        integrator `operatorApiKey` and the staff admin session: a keeper (a livestock owner)
        signs in to their OWN registry record and may only read/write their OWN herd,
        movements and certificate requests. Production establishes it by a one-time code to the
        keeper's verified mobile; the session is the same registry record integrators and the
        Admin Portal see (one keeper, many lenses).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key that makes a write safe to retry. The registry must
        return the original result for a repeated key (clients retry with backoff and
        a per-registry circuit breaker).
      schema: { type: string, maxLength: 200 }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid operator API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated principal cannot access this resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicting state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    AnimalRegistration:
      type: object
      description: An animal presented for national registration.
      required: [species, sex]
      properties:
        national_id:
          type: string
          readOnly: true
          deprecated: true
          description: Registry-generated official ID. Normal POST /animals rejects caller-supplied values; legacy IDs require the authority import path.
        visual_tag:
          type: string
          description: Human-readable ear-tag / brand number.
        eid:
          type: string
          description: Electronic ID (RFID) if fitted.
        species: { type: string, examples: [cattle] }
        breed: { type: string, examples: [Tuli] }
        sex: { type: string, enum: [male, female] }
        date_of_birth: { type: string, format: date }
        holding_id:
          type: string
          description: Registered holding / farm number (the keeper's premises).
        keeper_id:
          type: string
          description: The registry keeper this animal belongs to (resolve via /keepers/resolve).
        keeper_name:
          type: string
          deprecated: true
          description: Deprecated — kept for the legacy owner_name→keeper_name mapping; prefer keeper_id.
        district: { type: string }
        fmd_zone_code:
          type: string
          description: Veterinary zone the animal is kept in (see /zones).
        external_references:
          type: object
          additionalProperties: { type: string }
          description: |
            Per-integrator local IDs ({integrator_id: vendor_animal_id}) — aliases that point at
            this national_id, never a competing identity.
      additionalProperties: false

    AnimalAck:
      type: object
      required: [national_id, status]
      properties:
        national_id: { type: string, description: The official national ID (authoritative). }
        id: { type: string, description: Registry record ID. }
        status: { type: string, enum: [registered, already_exists] }
        generated_id:
          type: boolean
          description: true when the registry sequence minted the ID; false only for audited legacy import.
        id_source:
          type: string
          enum: [registry_sequence, legacy_import]
        matched_on:
          type: string
          enum: [tag]
          description: Present when an existing animal was matched by physical tag (find-or-create).
        registered_at: { type: string, format: date-time }

    AnimalRecord:
      allOf:
        - $ref: '#/components/schemas/AnimalRegistration'
        - type: object
          properties:
            national_id: { type: string }
            status: { type: string, enum: [active, slaughtered, dead, exported, lost] }
            registered_at: { type: string, format: date-time }
            current_holding_id: { type: string }
            trace_flags:
              type: array
              description: |
                Registry-applied flags that follow this animal. Absent or empty means none are
                recorded — never that none were checked. Read-only: there is no client path by
                which one can be written.
              items: { $ref: '#/components/schemas/TraceFlag' }

    KeeperResolve:
      type: object
      description: |
        Find-or-claim input. At least one of `national_id_no` / `msisdn` must be supplied — that
        natural key is what makes the keeper one row across the keeper app and every integrator.
      properties:
        national_id_no: { type: string, description: National identity number (sovereign natural key). }
        msisdn: { type: string, description: Verified mobile number — the smallholder natural key. }
        name: { type: string, description: Used only when creating a new keeper. }
        contact: { type: string }
      additionalProperties: false

    Keeper:
      type: object
      required: [keeper_id, name, status]
      properties:
        keeper_id: { type: string }
        name: { type: string }
        contact: { type: string }
        national_id_no: { type: [string, 'null'] }
        msisdn: { type: [string, 'null'] }
        verification:
          type: string
          enum: [claimed, verified]
          description: claimed (low-trust self-/vendor-asserted) vs verified (checked against a national ID).
        status: { type: string }
        outcome:
          type: string
          enum: [matched, created]
          description: Whether resolve matched an existing keeper or created a new one.

    Movement:
      type: object
      required: [animals, origin, destination, purpose]
      properties:
        permit_number:
          type: string
          description: Operator/local permit number, if any. The registry returns its own permit_reference.
        animals:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/MovementSubject' }
        head_count: { type: integer, minimum: 1 }
        origin:
          type: string
          description: Origin holding_id or description.
        origin_zone_code: { type: string }
        destination: { type: string }
        destination_zone_code: { type: string }
        destination_type:
          type: string
          enum: [farm, market, abattoir, export, other]
        purpose:
          type: string
          enum: [sale, breeding, grazing, slaughter, export, other]
        transporter: { type: string }
        vehicle_registration: { type: string }
        departure_date: { type: string, format: date }
        arrival_date: { type: string, format: date }
        vet_endorsement:
          type: string
          description: Name/ID of the endorsing veterinary official.
        regulatory_reference: { type: string }
      additionalProperties: false

    MovementSubject:
      type: object
      required: [national_id]
      properties:
        national_id: { type: string }
        visual_tag: { type: string }
        species: { type: string }
        fmd_zone_code: { type: string }

    MovementAck:
      type: object
      required: [permit_reference, status]
      description: |
        Acknowledgement that a **lodgement** was received — returned by `POST /movements` and by
        `POST /keeper/movements`. It is not a permit view; see `MovementPermitSummary`.
      properties:
        permit_reference: { type: string, description: Registry movement-request reference; it is not evidence of approval or issuance. }
        id: { type: string }
        status:
          type: string
          enum: [lodged, blocked]
          description: |
            A client lodges a request; only the authority control plane can later approve it.

            This enum stays at two values ON PURPOSE and must not be widened to the permit
            lifecycle. A lodgement is never born `approved`, so a schema that permitted it here
            would let a client read its own submission as an authorisation — the confusion
            `3b8e917` was written to end. The full lifecycle lives in
            `MovementLifecycleStatus`, on the read views that report what the authority did.
        crosses_zone_boundary: { type: boolean }
        recorded_at: { type: string, format: date-time }

    MovementLifecycleStatus:
      type: string
      enum: [lodged, under_review, approved, rejected, blocked, departed, arrived, completed, cancelled, expired]
      description: |
        The permit lifecycle as driven by the authority control plane
        (`POST /admin/movements/{ref}/{action}` — lodge | review | approve | reject | depart |
        arrive | complete | cancel). Read-only for clients: no client transition moves a permit
        through these states.

        `lodged` still means only that the request was recorded. **Approval is `approved` and
        nothing else.** The control plane's pre-lodgement `draft` state is deliberately absent —
        a client never sees a permit before it is lodged.

        One vocabulary, one place: the `/movements/list` filter and every permit read view
        reference this schema rather than restating it, so they cannot drift apart.

    MovementPermitSummary:
      type: object
      required: [permit_reference, status]
      description: |
        A permit as it appears in a **read** view (`GET /movements/list`): the same fields
        `MovementAck` carries, with the full lifecycle vocabulary instead of the two values a
        lodgement acknowledgement can take.

        Separate from `MovementAck` deliberately. Widening the shared acknowledgement would have
        fixed this endpoint by loosening two *write* acknowledgements
        (`POST /movements`, `POST /keeper/movements`) that are correct as they stand.
      properties:
        permit_reference: { type: string, description: Registry movement-request reference. }
        id: { type: string }
        status: { $ref: '#/components/schemas/MovementLifecycleStatus' }
        crosses_zone_boundary: { type: boolean }
        recorded_at: { type: string, format: date-time }

    MovementList:
      type: object
      required: [count, movements]
      description: Response of `GET /movements/list`.
      properties:
        count: { type: integer }
        movements:
          type: array
          items: { $ref: '#/components/schemas/MovementPermitSummary' }

    Vaccination:
      type: object
      required: [national_id, disease, administered_at]
      properties:
        national_id: { type: string }
        disease: { type: string, examples: [foot-and-mouth disease] }
        vaccine_name: { type: string }
        lot_number: { type: string, description: Vaccine batch identifier — the recall key. }
        lot_expiry:
          type: string
          format: date
          description: |
            Expiry date of the vaccine lot. `lot_number` identifies the batch for a recall;
            only the expiry says whether the dose was still viable when it was administered.
        dose: { type: string }
        administered_at: { type: string, format: date-time }
        next_due_at: { type: string, format: date-time }
        administered_by: { type: string, description: Veterinary official name/ID. }
        campaign_id: { type: string }
        cold_chain_ok:
          type: [boolean, 'null']
          description: |
            Attestation by the administering officer that the cold chain held for this dose.
            `false` is a cold-chain **exception** — it is the per-vaccination event that the
            control plane's `CampaignProgress.cold_chain_exceptions` counter counts, so a client
            reporting `false` here is reporting the thing that increments it.
            Null or absent means *not asserted*, which is NOT an assertion that the chain held.
        cold_chain_evidence_ref:
          type: [string, 'null']
          description: |
            Reference (hash or URI) into the integrator's own records for the evidence behind
            `cold_chain_ok`. A pointer only. Raw fridge telemetry — temperature time series,
            sensor readings, alarm logs — stays with the integrator and is never carried in the
            registry; the contract records the attestation and where to find its proof.
        dual_id_confirmed:
          type: [boolean, 'null']
          description: |
            The animal was presented with BOTH its permanent mark (brand or tattoo) and its tag
            at administration, and the two agreed. This is not "two tags": where a territory's
            law makes the permanent mark the legal identifier and the tag a supplement to it,
            this records that both were read. The legal weight of the confirmation is defined by
            the territory profile, not by this contract.
        holding_id:
          type: string
          description: |
            Holding at which the dose was administered. Recorded rather than derived: deriving it
            from the animal's current holding gives the wrong answer for any animal that has since
            moved, and coverage is computed per holding.
        zone_code:
          type: string
          description: |
            Veterinary / FMD zone at the time of administration. Recorded for the same reason as
            `holding_id` — zones change, and ring-vaccination coverage is a question about the
            zone as it was, not as it now is.
      additionalProperties: false

    VaccinationAck:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [recorded] }
        recorded_at: { type: string, format: date-time }

    ZoneDelta:
      type: object
      required: [server_version, zones]
      properties:
        server_version: { type: integer, format: int64, description: Highest zone_version in the registry. }
        zones_returned: { type: integer }
        zones:
          type: array
          items: { $ref: '#/components/schemas/Zone' }

    Zone:
      type: object
      required: [zone_code, zone_name, zone_type, movement_restriction, country_code, zone_version, effective_from]
      properties:
        zone_code: { type: string, examples: [ZW-FMD-RED-SE] }
        zone_name: { type: string }
        zone_type:
          type: string
          enum: [fmd_free, fmd_protection, fmd_infected, surveillance, standstill]
          description: |
            `standstill` is a **projection, not a declaration**. It appears when an active
            standstill order (`GET /v1/quarantine-orders`) covers this territory; the order is the
            record and this zone is its view. It is never authored through the control plane's
            zone endpoints, and lifting the order retracts it by setting `effective_until` and
            bumping `zone_version` — so the retraction propagates by the same mechanism as the
            declaration. `QuarantineOrder.projected_zone_code` names this zone.

            **Do not switch exhaustively on `zone_type`.** It is descriptive — used for labelling
            and colour. The load-bearing field for enforcement is `movement_restriction`, whose
            values are unchanged; a client that gates on `movement_restriction: blocked`, which is
            what the integration guide tells clients to do, is unaffected by any value added here.
        movement_restriction: { type: string, enum: [none, restricted, blocked] }
        country_code: { type: string, default: ZW }
        registry: { type: string, default: zlits }
        boundary_wkt:
          type: [string, 'null']
          description: WKT polygon/multipolygon, or null when registry-only (no spatial guard).
        zone_version: { type: integer, format: int64 }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }

    QuarantineOrderDelta:
      type: object
      required: [server_version, orders]
      properties:
        server_version:
          type: integer
          format: int64
          description: Highest order_version in the registry. Persist it and pass it back as since_version.
        orders_returned: { type: integer }
        orders:
          type: array
          items: { $ref: '#/components/schemas/QuarantineOrder' }

    QuarantineOrder:
      type: object
      description: |
        An act of authority that closes a holding, a section, an animal or an area — the fact that
        sits between "this animal is sick" and "this truck does not leave". Before this schema
        existed the decision lived in a paper notice served on the keeper and, if the officer
        thought to do it, a zone; a client could read neither, so a farm app whose keeper was
        under quarantine would cheerfully lodge a movement and let the stock leave.

        **Read-only on this plane.** Authored on the control plane.

        **The contract carries dates and their meaning, never the rule that produced them.** See
        `milestones`.
      required: [order_id, order_type, status, scope, subject_id, order_version, country_code, effective_from]
      properties:
        order_id: { type: string, examples: [ZW-QO-2026-000412] }
        order_type: { $ref: '#/components/schemas/OrderType' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        scope: { $ref: '#/components/schemas/OrderScope' }
        subject_id:
          type: string
          description: 'holding_id | section_id | national_id | zone_code, per `scope`.'
        section_id:
          type: [string, 'null']
          description: |
            Set when `scope` is `section`. Section scope is valid only where the holding has an
            accepted biosecurity attestation declaring its sections — you cannot quarantine the
            north shed of a holding that has never told the registry it has sheds. That attestation
            surface does not exist yet, so `scope: section` is **specified and not issuable**: the
            control plane refuses to author one with `422 sections_not_declared` rather than
            issuing an order it cannot describe.
        disease:
          type: string
          description: WOAH vocabulary, as on DiseaseCaseReport.disease.
        disease_case_id:
          type: [string, 'null']
          description: The disease case that prompted the order, where there is one.
        order_version:
          type: integer
          format: int64
          description: Monotonic. This is the delta cursor — every change to the order bumps it.
        country_code: { type: string, default: ZW }
        declared_verbally_at:
          type: [string, 'null']
          format: date-time
          description: |
            When a veterinary officer told the keeper, at the gate, that nothing leaves. In the
            field the verbal order comes first and the written instrument follows — sometimes days
            later, and in an outbreak reliably later. A contract that modelled only the written
            instrument would be blind during the first forty-eight hours, which is the window that
            decides whether the outbreak is contained.

            Whether a verbal order is enforceable before written confirmation is a **statutory**
            question, and the contract does not decide it: each profile states what its territory's
            law requires. An order with neither this timestamp nor `confirmed_in_writing_at` cannot
            be `active`.
        confirmed_in_writing_at:
          type: [string, 'null']
          format: date-time
          description: When the written instrument was served. See declared_verbally_at.
        effective_from: { type: string, format: date-time }
        effective_until: { type: [string, 'null'], format: date-time }
        milestones:
          type: array
          description: |
            Dates the registry computed under its own territory's profile, each labelled with what
            it means. **The contract carries no jurisdiction's arithmetic**: how long a quarantine
            lasts and when a slaughter window opens differ between territories and between
            diseases, and change by gazette without warning. Hard-coding one country's numbers into
            an open standard would quietly make the standard that country's, and a national instance
            would then have to fork it to obey its own law.

            So the client renders and acts on these dates without knowing the rule that produced
            them — a client shows "review due 12 March" because the registry said so, not because
            it re-derived it from a stale copy of the rules and got a different answer.
          items: { $ref: '#/components/schemas/OrderMilestone' }
        conditions:
          type: array
          description: What the order requires, as codes. See OrderCondition for the fail-closed rule.
          items: { $ref: '#/components/schemas/OrderCondition' }
        issuing_authority: { type: string }
        issuing_officer_ref:
          type: string
          description: |
            Officer identifier, **not** a personal name. The audit trail needs to resolve to a
            person; this feed — readable by every accredited integrator — does not need to publish
            which named official closed which named farm.
        legal_basis:
          type: string
          description: Profile-supplied citation for the power exercised. The contract does not supply it.
        gazette_reference: { type: [string, 'null'] }
        projected_zone_code:
          type: [string, 'null']
          description: |
            The zone this order projects into (`GET /v1/zones`), for a standstill. Join on it so
            one restriction is not counted as two.
        lifted_at: { type: [string, 'null'], format: date-time }
        lift_reason: { type: [string, 'null'] }

    OrderType:
      type: string
      description: |
        `quarantine` closes a subject; `standstill` is the national "nothing moves" declaration
        made in the first hours of an outbreak, and is additionally projected into `/v1/zones`.
      enum: [quarantine, standstill]

    OrderStatus:
      type: string
      description: |
        Pinned vocabulary — seam pin `order-status`. The full lifecycle is
        `draft | active | suspended | lifted | revoked | expired`; **`draft` is deliberately absent
        here**, exactly as it is absent from `MovementLifecycleStatus`, because a client never sees
        an order the authority has not yet made. Drafts are visible only on the control plane.

        `lifted` and `revoked` are terminal but still published in the delta — see the endpoint
        description for why retraction must be a positive statement.
      enum: [active, suspended, lifted, revoked, expired]

    OrderScope:
      type: string
      description: |
        What the order binds. `section` is specified but not issuable until a holding can declare
        its sections — see `QuarantineOrder.section_id`.
      enum: [holding, section, animal, area]

    OrderMilestone:
      type: object
      description: |
        One date the registry computed, and what that date means. A profile that requires a
        milestone this vocabulary lacks is the trigger to extend the vocabulary — deliberately,
        once, for everyone — rather than to add a bespoke field for one country.
      required: [code, date]
      properties:
        code: { $ref: '#/components/schemas/OrderMilestoneCode' }
        date: { type: string, format: date }
        note:
          type: string
          description: Human context. Never the machine meaning — that is what `code` is for.

    OrderMilestoneCode:
      type: string
      description: |
        Pinned vocabulary. Each profile states **which of these its law requires and how it is
        derived**; the contract states only that the date exists and what it is called.
      enum: [day_zero, slaughter_window_opens, slaughter_window_closes, review_due, lift_eligible]

    OrderCondition:
      type: object
      description: |
        What the order requires, machine-readable, so a client can enforce it rather than display
        it and hope.
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/OrderConditionCode' }
        note:
          type: string
          description: Human context. Never the machine meaning.

    OrderConditionCode:
      type: string
      description: |
        Pinned vocabulary — seam pin `permit-condition-codes`, shared with movement permits.

        - `no_movement_on_off` — nothing enters, nothing leaves.
        - `movement_by_permit_only` — movement allowed only under an issued permit.
        - `cd_required` — cleaning & disinfection required before release. The registry carries the
          condition and the fact that it was certified complete; the checklist, the products, the
          operator and the photographs stay in the farm app.
        - `sampling_required` — surveillance sampling required before lift.
        - `section_isolation_granted` — a declared section is isolated from the rest of the holding.

        **A client that meets a code it does not recognise MUST fail closed** — treat the order as
        at least as restrictive as `no_movement_on_off`. This inverts the repo's usual additive-enum
        rule ("clients may ignore a new value"), and the inversion is deliberate: for a
        *restriction* vocabulary, a client that ignores what it does not understand permits a
        movement the authority forbade. The cost of a wrongly-blocked movement is a delayed truck;
        the cost of a wrongly-permitted one is the disease leaving the cordon.

        The consequence, stated rather than discovered later: **adding a code here is not a free
        additive change.** It moves already-deployed clients from permitting to blocking on their
        next sync. It needs a minor version bump and integrator notice, and it is safe only in that
        direction.
      enum:
        - no_movement_on_off
        - movement_by_permit_only
        - cd_required
        - sampling_required
        - section_isolation_granted

    TraceFlag:
      type: object
      description: |
        A fact that follows an animal, sometimes for the rest of its life — an animal that has been
        serologically positive may never be eligible for certain markets again, whatever a later
        test says.

        **Registry-applied only. There is no client write path, and that is the point rather than
        an oversight.** A lifelong mark on a keeper's animal is a determination with real economic
        consequence for a named person: it must carry an officer, a legal basis and an audit entry,
        and it must be appealable. A farm app that could stamp it would be exercising authority it
        does not have, and the audit trail would record a vendor key instead of a decision-maker.
      required: [code, applied_at]
      properties:
        code: { $ref: '#/components/schemas/TraceFlagCode' }
        applied_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: |
            **Null means lifelong** — the flag never expires and is not re-evaluated. This is stated
            explicitly because the alternative reading of a null, "not yet set", would be
            catastrophic in exactly the wrong direction: a client that treated it as unset would
            drop a permanent market disqualification.
        order_id:
          type: [string, 'null']
          description: The order under which the flag was applied, where there was one.
        disease: { type: [string, 'null'] }
        applied_by:
          type: string
          description: The issuing authority. Never an integrator key.

    TraceFlagCode:
      type: string
      description: Pinned vocabulary — seam pin `trace-flag-codes`.
      enum: [sero_positive_lifelong, quarantine_history]

    CampaignList:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/Campaign' }

    Campaign:
      type: object
      required: [id, disease, status]
      properties:
        id: { type: string, examples: [ZW-FMD-2026-RING-SE] }
        disease: { type: string, examples: [FMD] }
        vaccine: { type: [string, 'null'] }
        species: { type: [string, 'null'], description: Target species, or null for all. }
        mandatory: { type: boolean, default: false }
        zone_code: { type: [string, 'null'], description: Zone the campaign applies to, or null for national. }
        status: { type: string, enum: [planned, active, completed] }
        starts_at: { type: [string, 'null'], format: date }
        ends_at: { type: [string, 'null'], format: date }
        coverage_target: { type: [number, 'null'], description: Target coverage fraction 0-1. }

    CertificateRequest:
      type: object
      required: [kind, subject_type, subject_id]
      properties:
        kind:
          type: string
          enum: [movement_permit, health, export, traceability]
        subject_type:
          type: string
          enum: [animal, consignment, movement]
        subject_id:
          type: string
          description: national_id, permit_reference, or movement id, per `kind`.
        destination: { type: string }
        valid_until: { type: string, format: date }
        vet_endorsement:
          type: string
          description: Name/ID of the endorsing Official Veterinarian, where required.
        notes: { type: string }
      additionalProperties: false

    Certificate:
      type: object
      required: [id, kind, reference, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [movement_permit, health, export, traceability] }
        subject_type: { type: string }
        subject_id: { type: string }
        reference: { type: string, description: Official certificate number assigned by the registry. }
        status: { type: string, enum: [requested, issued, revoked, superseded, expired] }
        issued_at: { type: string, format: date-time }
        valid_until: { type: [string, 'null'], format: date }
        signing_key_id: { type: string, description: Key the competent authority signed with. }
        signature: { type: string, description: Base64 detached signature over the canonical payload. }
        seal_level: { type: string, enum: [B, T, LT], description: 'ETSI baseline of the qualified e-seal: B (seal), T (+ qualified timestamp), LT (+ embedded validation data).' }
        seal: { $ref: '#/components/schemas/QualifiedSeal' }
        verify_token: { type: string }
        verify_url:
          type: string
          format: uri
          description: Public QR target — resolves to GET /verify/{token}; clients may call GET /v1/verify/{token} for JSON status.
        pdf_url:
          type: string
          format: uri
          description: Canonical printable PDF rendered and signed by the registry.
        revoked_at: { type: [string, 'null'], format: date-time }
        revocation_reason: { type: [string, 'null'] }

    CertificateRevocation:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    VerificationResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        kind: { type: string, description: Present when the token resolves to a certificate. }
        reference: { type: string }
        national_id: { type: string }
        species: { type: string }
        status: { type: string }
        holding_district: { type: string }
        last_verified_event: { type: string }
        issued_at: { type: string, format: date-time }
        valid_until: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        pdf_url: { type: string, description: Public PDF of the issued certificate, when available. }
        seal_level: { type: string, enum: [B, T, LT], description: 'Qualified e-seal level on the certificate, when sealed.' }
        seal:
          type: object
          description: Compact qualified-seal status (full report via POST /seals/verify).
          properties:
            level: { type: string, enum: [B, T, LT] }
            serial: { type: string }
            indication: { type: string, enum: [TOTAL_PASSED, INDETERMINATE, TOTAL_FAILED] }
            sub_indication: { type: [string, 'null'] }

    QualifiedSeal:
      type: object
      description: |
        An eIDAS qualified electronic seal over a certificate's canonical core (JAdES-style). It wraps
        the issuer's detached signature with the certificate chain to the national trust anchor, a
        qualified timestamp (level ≥ T) and embedded validation data (level LT) for offline verification.
      required: [format, level, value, chain]
      properties:
        format: { type: string, examples: [LITS-JAdES/1.0] }
        level: { type: string, enum: [B, T, LT] }
        alg: { type: string, examples: [EdDSA] }
        kid: { type: string, description: Issuer key id the seal value was produced with. }
        seal_serial: { type: string, description: Serial of the qualified seal certificate used. }
        created: { type: string, format: date-time }
        value: { type: string, description: Base64 Ed25519 signature over the canonical core. }
        chain:
          type: array
          description: 'Seal certificate then trust anchor (x5c-equivalent).'
          items: { type: object }
        timestamp: { type: object, description: 'Qualified timestamp token (level ≥ T).' }
        validation_data: { type: object, description: 'Trusted-list reference + revocation snapshot (level LT).' }

    SealValidationReport:
      type: object
      description: ETSI TS 119 102-1 validation result for a qualified e-seal.
      required: [indication]
      properties:
        indication: { type: string, enum: [TOTAL_PASSED, INDETERMINATE, TOTAL_FAILED] }
        sub_indication:
          type: [string, 'null']
          description: 'e.g. SIG_CRYPTO_FAILURE, NO_CERTIFICATE_CHAIN, REVOKED, EXPIRED, OUT_OF_BOUNDS_NO_POE, FORMAT_FAILURE.'
        level: { type: [string, 'null'], enum: [B, T, LT, 'null'] }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [passed, failed] }
              detail: { type: string }
        seal_certificate: { type: [object, 'null'] }
        proof_of_existence: { type: [string, 'null'], format: date-time }
        validated_at: { type: string, format: date-time }

    TrustList:
      type: object
      description: |
        The signed national Trusted List (EU LOTL-equivalent) — trust anchor, qualified seal
        certificates, the time-stamp authority, and the revocation list — pinned by an importing
        authority to verify qualified e-seals offline.
      required: [scheme, trust_anchors, seal_certificates]
      properties:
        scheme: { type: string, examples: [LITS-Trusted-List/1.0] }
        territory: { type: string, description: ISO country code of the issuing registry. }
        operator: { type: object }
        sequence_number: { type: integer }
        list_issued: { type: string, format: date-time }
        trust_anchors: { type: array, items: { type: object } }
        seal_certificates: { type: array, items: { type: object } }
        revocation_list: { type: object }
        proof: { type: object, description: Anchor signature over the list. }

    AnimalMovementHistory:
      type: object
      required: [national_id, movements]
      properties:
        national_id: { type: string }
        movements:
          type: array
          description: Ordered movement steps, oldest first.
          items:
            type: object
            required: [step_seq, holding_id, movement_ref, departed_at]
            properties:
              step_seq: { type: integer, description: Chronological order (1 = first recorded movement). }
              holding_id: { type: string, description: Destination holding at this step. }
              zone_code: { type: [string, 'null'] }
              movement_ref: { type: string, description: Registry permit reference. }
              purpose: { type: string }
              departed_at: { type: [string, 'null'], format: date }
              arrived_at: { type: [string, 'null'], format: date }

    AnimalHealthStatus:
      type: object
      required: [national_id, disease_free, zone_code]
      properties:
        national_id: { type: string }
        zone_code: { type: [string, 'null'], description: Current FMD zone of the holding the animal is on. }
        disease_free:
          type: boolean
          description: True when no active notifiable disease case exists for this animal in the last 60 days.
        fmd_vaccinated: { type: boolean }
        last_test_result:
          type: [string, 'null']
          enum: [positive, negative, inconclusive, null]
        last_test_date: { type: [string, 'null'], format: date }
        last_test_disease: { type: [string, 'null'] }
        vaccinations:
          type: array
          description: Most recent vaccination per disease.
          items:
            type: object
            properties:
              disease: { type: string }
              vaccine_name: { type: [string, 'null'] }
              administered_at: { type: string, format: date-time }
              next_due_at: { type: [string, 'null'], format: date-time }
        campaign_ids:
          type: array
          items: { type: string }
          description: Active campaign IDs the animal is enrolled in.
        trace_flags:
          type: array
          description: |
            Registry-applied flags that follow this animal. A market-access decision made from
            `disease_free` and `last_test_result` alone can be wrong in the permissive direction:
            a `sero_positive_lifelong` flag outlives any later negative test, which is precisely
            why it exists. Absent or empty means none are recorded, never that none were checked.
          items: { $ref: '#/components/schemas/TraceFlag' }
        snapshot_at: { type: string, format: date-time, description: Timestamp of this snapshot. }

    HoldingDetail:
      type: object
      required: [holding_id, name, district]
      properties:
        holding_id: { type: string }
        name: { type: string }
        district: { type: string }
        province: { type: [string, 'null'] }
        keeper_id: { type: [string, 'null'] }
        zone_code: { type: [string, 'null'] }
        holding_type:
          type: string
          enum: [communal, commercial, small_scale, feedlot, abattoir]
          default: commercial
        lat: { type: [number, 'null'], format: double, description: GPS latitude (WGS-84). }
        lng: { type: [number, 'null'], format: double, description: GPS longitude (WGS-84). }
        accuracy_m: { type: [integer, 'null'], description: GPS accuracy radius in metres. }
        deforestation_free:
          type: boolean
          default: false
          description: |
            Holding is verified deforestation-free per the operator's EUDR assessment.
            Set by a DVS-authorised administrator via the admin control plane.
        legality_verified:
          type: boolean
          default: false
          description: |
            Land-use legality verified per EUDR Article 2(1). Set by a DVS-authorised
            administrator via the admin control plane.
        eudr_verified_at:
          type: [string, 'null']
          format: date-time
          description: Timestamp when EUDR flags were last set/confirmed by the competent authority.

    DiseaseCaseReport:
      type: object
      required: [disease]
      description: |
        A disease observation submitted by an accredited integrator or field system.
        Either `holding_id` or `national_id` (or both) must be supplied as the anchor.
      properties:
        disease:
          type: string
          description: |
            Notifiable disease name, lower-case, using official WOAH vocabulary.
            Examples: foot-and-mouth disease, anthrax, lumpy skin disease, brucellosis.
        holding_id:
          type: [string, 'null']
          description: Holding where the case was observed. Mutually optional with national_id.
        national_id:
          type: [string, 'null']
          description: Specific animal involved, if identified. Mutually optional with holding_id.
        classification:
          type: string
          enum: [suspect, probable, confirmed, discarded]
          default: suspect
          description: Field entry should always be `suspect`; a veterinarian reclassifies.
        detection_method:
          type: string
          enum: [passive, active, syndromic, abattoir, laboratory, post_mortem]
          default: passive
        clinical_signs:
          type: array
          items: { type: string }
          description: Clinical signs observed (free-text, per WOAH Chapter 1.4 vocabulary).
        onset_date:
          type: [string, 'null']
          format: date
          description: Date clinical signs were first observed.
        animals_at_risk:
          type: integer
          minimum: 0
          default: 0
          description: Number of susceptible animals on the holding.
        animals_affected:
          type: integer
          minimum: 0
          default: 0
        animals_dead:
          type: integer
          minimum: 0
          default: 0
        outcome:
          type: string
          enum: [under_treatment, recovered, died, slaughtered, destroyed, unknown]
          default: unknown
        lab_ref:
          type: [string, 'null']
          description: Laboratory sample reference, if already submitted.
        vet_reg_no:
          type: [string, 'null']
          description: Reporting veterinarian's registration number.
      additionalProperties: false

    DiseaseCaseAck:
      type: object
      required: [id, reference, status, recorded_at]
      properties:
        id: { type: string }
        reference: { type: string, description: Official disease case reference number. }
        status: { type: string, const: received }
        recorded_at: { type: string, format: date-time }

    DiseaseCaseDetail:
      allOf:
        - $ref: '#/components/schemas/DiseaseCaseReport'
        - type: object
          required: [id, reference, status, recorded_at]
          properties:
            id: { type: string }
            reference: { type: string }
            status: { type: string, enum: [open, closed, discarded] }
            recorded_at: { type: string, format: date-time }
            last_updated_at: { type: string, format: date-time }
            updated_by: { type: [string, 'null'] }

    DiseaseCaseUpdate:
      type: object
      required: [vet_reg_no]
      description: Reclassification or outcome update. At least one of classification / outcome must be set.
      properties:
        classification:
          type: [string, 'null']
          enum: [suspect, probable, confirmed, discarded, null]
        outcome:
          type: [string, 'null']
          enum: [under_treatment, recovered, died, slaughtered, destroyed, unknown, null]
        vet_reg_no:
          type: string
          description: Veterinarian making the reclassification — required for accountability.
        notes: { type: [string, 'null'] }
      additionalProperties: false

    LabResultReport:
      type: object
      required: [national_id, disease, test_method, result, sampled_at, resulted_at, lab_name]
      properties:
        national_id: { type: string }
        sample_type:
          type: string
          examples: [serum, tissue, swab, whole_blood]
        disease:
          type: string
          description: WOAH-vocabulary disease name.
        test_method:
          type: string
          examples: [ELISA, PCR, virus_isolation, CFT, VNT]
        result:
          type: string
          enum: [positive, negative, inconclusive]
        lab_ref: { type: [string, 'null'], description: Laboratory internal sample / batch reference. }
        sampled_at: { type: string, format: date-time }
        resulted_at: { type: string, format: date-time }
        lab_name: { type: string }
        vet_reg_no: { type: [string, 'null'] }
      additionalProperties: false

    LabResultAck:
      type: object
      required: [id, status, recorded_at]
      properties:
        id: { type: string }
        status: { type: string, const: received }
        linked_case_id:
          type: [string, 'null']
          description: Disease case ID auto-linked when result is positive for a notifiable disease.
        recorded_at: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [zone_blocked] }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

