name: validate-contract

# Quality gate for the open LITS API contract. The contract is the single agreement
# between every national registry and every client, so it must never merge broken.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validators
        run: python -m pip install --quiet pyyaml openapi-spec-validator
      - name: Structural + spec validation (+ SPDX headers)
        run: python3 scripts/validate.py

      # This runner checks out only this repository, so the sibling registers
      # (FuroField, FuroTrack, Dzinza) are not here and the run reports
      # SELF-CHECK ONLY: it verifies our vocabulary against its recorded
      # canonical digest and names every sibling it could NOT compare, rather
      # than letting an absent repo read as agreement. The four-way comparison
      # is ~/projects/FuroField/scripts/check-standards-parity.sh, run from a
      # machine holding all four checkouts.
      - name: Standards vocabulary parity (self-check; siblings absent on CI)
        run: python3 scripts/check-standards-parity.py
      - name: Lint OpenAPI (Redocly)
        run: npx --yes @redocly/cli@latest lint openapi.yaml openapi-admin.yaml --format=stylish
