# SPDX-FileCopyrightText: 2026 The LITS steward
# SPDX-License-Identifier: Apache-2.0
#
# LITS standards register — the machine-readable form of docs/standards-and-compliance.md.
#
# This repo is a published contract, so its register is part of the deliverable
# rather than internal bookkeeping. It states what the STANDARD requires and
# where the contract carries it. It deliberately does NOT carry codePaths into
# the reference implementation: that lives in the operator's private repo, whose
# own register (repo: dzinza) proves the implementation half.
#
# Validated by scripts/validate.py against standards/vocabulary.v1.json — the
# same schema FuroField, FuroTrack and Dzinza pin, byte for byte.
#
# Statuses follow the vocabulary:
#   implemented | partial | roadmap | not_applicable | external_assessment
#
# The "explicitly not planned" decisions from docs/standards-and-compliance.md §5
# are recorded here as not_applicable WITH their justification, so they are never
# re-flagged as gaps by a later audit.

vocabularyVersion: "1.0.0"
