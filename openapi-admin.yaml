openapi: 3.1.0
info:
  title: LITS Admin / Control-Plane API
  version: 1.4.0-draft
  summary: Sovereign control-plane API — zones, integrator accreditation & keys, audit.
  description: |
    The control-plane API used **only** by the LITS Admin Portal (DVS / operator staff).
    It is deliberately SEPARATE from the client contract (`openapi.yaml`): different
    audience, different security scheme. Integrator clients (FuroTrack and others) never
    call these endpoints. This split encodes the two-plane model — see
    `docs/registry-operations.md`.

    STATUS: DRAFT CONTRACT. Hosts are operator/State placeholders, never a vendor domain.
  contact:
    name: LITS registry operator (TBD — DVS / delegated operator)
  license:
    name: To be set by the operator/State
servers:
  - url: https://api.example.gov/v1
    description: Production (operator-owned; placeholder host)
  - url: https://sandbox.example.gov/v1
    description: Sandbox

security:
  - adminSession: []

tags:
  - name: zones-admin
    description: Declare and maintain veterinary / FMD zones (sovereign reg-data).
  - name: integrators
    description: Accredit integrators and issue / rotate / revoke their API keys.
  - name: audit
    description: Read the immutable action log and produce signed exports.
  - name: certificates-admin
    description: Authority issuance & revocation of certificates (delegated approval).
  - name: trust-admin
    description: |
      National trust anchor, Trusted List and qualified-seal certificates (RFC 0001) —
      inspection and verification (`trust:read`), rotation and revocation (`trust:manage`).
  - name: movements-admin
    description: Movement-permit lifecycle transitions.
  - name: campaigns-admin
    description: Vaccination-campaign lifecycle (pause / resume / complete).
  - name: holdings-admin
    description: Register establishments (holdings) and keepers.
  - name: herd-admin
    description: Correct animal records (e.g. resolve data-quality issues).
  - name: inspectorate-admin
    description: Configure inspection templates and record structured field inspections.
  - name: corrective-admin
    description: Manage corrective actions raised from inspection and compliance findings.
  - name: compliance-admin
    description: Compliance audits, findings, and accreditation market-access controls.
  - name: enforcement-admin
    description: Enforcement cases, notices, fines, appeals, and sanctions register actions.

paths:
  /admin/certificates:
    get:
      tags: [certificates-admin]
      operationId: listCertificatesAdmin
      summary: List certificates (all states)
      responses:
        '200':
          description: Certificates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/certificates/{id}/issue:
    post:
      tags: [certificates-admin]
      operationId: issueCertificate
      summary: Issue & sign a requested certificate (Official Vet / DVS only)
      description: |
        Transitions a `requested` certificate to `issued`, applying the competent
        authority's e-signature and assigning the verify token + PDF. Authority action —
        an integrator key can never reach this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Certificate issued & signed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/certificates/{id}/revoke:
    post:
      tags: [certificates-admin]
      operationId: revokeCertificate
      summary: Revoke a certificate (Official Vet / DVS only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revocation' }
      responses:
        '200':
          description: Certificate revoked (reflected immediately at public verify).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/movements:
    post:
      tags: [movements-admin]
      operationId: createMovement
      summary: Create a movement permit (draft)
      description: Creates a permit in `draft`; the lifecycle then advances via transitions. Requires `movements:review`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementCreate' }
      responses:
        '201':
          description: Permit created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/movements/{ref}/{action}:
    post:
      tags: [movements-admin]
      operationId: transitionMovement
      summary: Advance a movement permit through its lifecycle
      description: |
        `action` is one of lodge | review | approve | reject | depart | arrive | complete |
        cancel. Validated against the permit's current state.
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated movement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/campaigns:
    post:
      tags: [campaigns-admin]
      operationId: createCampaign
      summary: Create a vaccination campaign
      description: Requires `campaigns:write`. Starts `active` with `overdue` equal to the target.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignCreate' }
      responses:
        '201':
          description: Campaign created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/campaigns/{id}:
    patch:
      tags: [campaigns-admin]
      operationId: updateCampaign
      summary: Update a campaign (disease / province / target)
      description: Requires `campaigns:write`. Recomputes coverage.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignUpdate' }
      responses:
        '200':
          description: Updated campaign.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [campaigns-admin]
      operationId: deleteCampaign
      summary: Delete a campaign
      description: Requires `campaigns:write`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/campaigns/{id}/record:
    post:
      tags: [campaigns-admin]
      operationId: recordCampaignProgress
      summary: Record campaign progress (vaccinations / cold-chain / follow-ups)
      description: |
        Requires `campaigns:write`. Adds vaccinations (capped at target), increments cold-chain
        exceptions, decrements overdue follow-ups, and recomputes coverage.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignProgress' }
      responses:
        '200':
          description: Updated campaign.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/campaigns/{id}/{action}:
    post:
      tags: [campaigns-admin]
      operationId: transitionCampaign
      summary: Advance a vaccination campaign through its lifecycle
      description: |
        `action` is one of pause | resume | complete. Validated against the
        campaign's current state (`completed` is terminal). Requires `campaigns:write`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, complete] } }
      responses:
        '200':
          description: Updated campaign.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/animals/import-legacy:
    post:
      tags: [herd-admin]
      operationId: importLegacyAnimal
      summary: Import a historical animal with an existing lawful national ID
      description: |
        Requires `settings:write` plus authority confirmation. Normal animal registration always
        generates `national_id`; this endpoint exists only for migration of historical ledgers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalImport' }
      responses:
        '201':
          description: Imported or already present.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalAck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/animals/{id}:
    patch:
      tags: [herd-admin]
      operationId: updateAnimal
      summary: Correct an animal record
      description: |
        Requires `herd:write`. Updates supplied fields (district, holding, breed, etc.) — used
        to resolve data-quality issues. Returns the updated record with its timeline.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalUpdate' }
      responses:
        '200':
          description: Updated animal.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/animals/{id}/merge:
    post:
      tags: [herd-admin]
      operationId: mergeAnimal
      summary: Merge a duplicate animal into a survivor (§9.6 — the loser redirects)
      description: |
        Requires `herd:write`. Re-points vaccinations, movements, certificates and the tag index
        to `into`; the loser is marked `merged`. national_id is never reissued.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [into], properties: { into: { type: string, description: Survivor national_id. } } } } }
      responses:
        '200': { description: Merged., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/keepers/{keeper_id}/merge:
    post:
      tags: [holdings-admin]
      operationId: mergeKeeper
      summary: Merge a duplicate keeper into a survivor (§9.6)
      description: Requires `holdings:write`. Re-points animals, holdings, authorizations and the natural-key index to `into`.
      parameters:
        - { name: keeper_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [into], properties: { into: { type: string, description: Survivor keeper_id. } } } } }
      responses:
        '200': { description: Merged., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/holdings:
    post:
      tags: [holdings-admin]
      operationId: registerHolding
      summary: Register an establishment (holding)
      description: Requires `holdings:write`. A fresh holding is `incomplete` until geo is captured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldingCreate' }
      responses:
        '201':
          description: Holding registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/keepers:
    post:
      tags: [holdings-admin]
      operationId: registerKeeper
      summary: Register an animal keeper
      description: Requires `holdings:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeeperCreate' }
      responses:
        '201':
          description: Keeper registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keeper' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/zones:
    post:
      tags: [zones-admin]
      operationId: declareZone
      summary: Declare a veterinary / FMD zone
      description: |
        Creates a zone (gazetted under the Animal Health Act). Assigns the next
        `zone_version` so client delta-sync (`GET /v1/zones`) picks it up immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneWrite' }
      responses:
        '201':
          description: Zone declared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [zones-admin]
      operationId: listZonesAdmin
      summary: List zones (admin view, incl. drafts/expired)
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/zones/{zone_code}:
    patch:
      tags: [zones-admin]
      operationId: updateZone
      summary: Update or expire a zone
      description: Updating a zone bumps its `zone_version`. Set `effective_until` to expire it.
      parameters:
        - name: zone_code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneWrite' }
      responses:
        '200':
          description: Zone updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/zones/outbreak:
    post:
      tags: [zones-admin]
      operationId: declareOutbreakZone
      summary: Emergency outbreak declaration (fast-path)
      description: |
        Declares an FMD/quarantine zone immediately and bumps `zone_version` so field
        devices pull it on next sync. For authorised veterinary officers only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneWrite' }
      responses:
        '201':
          description: Outbreak zone declared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrators:
    post:
      tags: [integrators]
      operationId: accreditIntegrator
      summary: Accredit an integrator
      description: Registers a vendor (e.g. FuroTrack) so it may be issued API keys.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegratorCreate' }
      responses:
        '201':
          description: Integrator accredited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrator' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [integrators]
      operationId: listIntegrators
      summary: List integrators
      responses:
        '200':
          description: Integrators.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Integrator' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrators/{id}/keys:
    post:
      tags: [integrators]
      operationId: issueApiKey
      summary: Issue an API key for an integrator
      description: |
        Returns the secret **once** — it is not retrievable again. The integrator uses it
        as the `operatorApiKey` bearer token against the client API (`openapi.yaml`).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Key issued (secret shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyIssued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/keys/{key_id}/rotate:
    post:
      tags: [integrators]
      operationId: rotateApiKey
      summary: Rotate an API key
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: New key issued (secret shown once); the old key is revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyIssued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/keys/{key_id}:
    delete:
      tags: [integrators]
      operationId: revokeApiKey
      summary: Revoke an API key
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Key revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/audit:
    get:
      tags: [audit]
      operationId: readAudit
      summary: Read the immutable action log
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit/export:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Signed, timestamped audit export
      description: Produces a signed export for regulator / independent auditors.
      responses:
        '200':
          description: Signed audit export.
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, signature, entries]
                properties:
                  generated_at: { type: string, format: date-time }
                  signing_key_id: { type: string }
                  signature: { type: string }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/inspection-templates:
    get:
      tags: [inspectorate-admin]
      operationId: listInspectionTemplates
      summary: List inspection checklist templates
      parameters:
        - { name: inspection_type, in: query, required: false, schema: { type: string } }
        - { name: published_only, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Inspection templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InspectionTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [inspectorate-admin]
      operationId: createInspectionTemplate
      summary: Create a draft inspection checklist template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionTemplateWrite' }
      responses:
        '201':
          description: Draft template created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/inspection-templates/{id}:
    patch:
      tags: [inspectorate-admin]
      operationId: updateInspectionTemplate
      summary: Edit an inspection template draft or create a new draft version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionTemplateWrite' }
      responses:
        '200':
          description: Template updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/inspection-templates/{id}/publish:
    post:
      tags: [inspectorate-admin]
      operationId: publishInspectionTemplate
      summary: Publish a template version for field use
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Template published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/inspection-templates/{id}/retire:
    post:
      tags: [inspectorate-admin]
      operationId: retireInspectionTemplate
      summary: Retire an inspection template
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Template retired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
