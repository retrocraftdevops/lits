  # ---- trust fabric: qualified e-seals (eIDAS) — trust:read / trust:manage --------------------------
  /admin/trust:
    get:
      tags: [trust-admin]
      operationId: trustOverview
      summary: National trust fabric (anchor, qualified seal certificates, TSA, revocation list)
      description: Requires `trust:read`. The trust anchor, the active/superseded qualified seal certificates, the time-stamp authority and the seal-revocation list.
      responses:
        '200': { description: Trust-fabric overview. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trust/list:
    get:
      tags: [trust-admin]
      operationId: trustPublishedList
      summary: The signed Trusted List as published at /v1/trust-list
      description: Requires `trust:read`.
      responses:
        '200': { description: The signed Trusted List. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trust/verify:
    post:
      tags: [trust-admin]
      operationId: trustVerifySeal
      summary: Validate a pasted qualified seal / eCert (ETSI report)
      description: Requires `trust:read`. Accepts a certificate with a `seal`, or `{ seal, core }` / eCert `{ qualified_seal, signed_core }`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: ETSI TS 119 102-1 validation report. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trust/seals/rotate:
    post:
      tags: [trust-admin]
      operationId: trustRotateSeal
      summary: Rotate the issuer seal certificate (routine key hygiene)
      description: Requires `trust:manage`. Supersedes the active certificate; existing seals keep validating against the superseded (not revoked) certificate.
      responses:
        '200': { description: The new active qualified seal certificate. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trust/seals/{serial}/revoke:
    post:
      tags: [trust-admin]
      operationId: trustRevokeSeal
      summary: Revoke a seal certificate (e.g. key compromise)
      description: Requires `trust:manage`. Seals citing the serial then validate as REVOKED; if it was active, a fresh certificate is rotated in.
      parameters:
        - { name: serial, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '200': { description: Revocation recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    adminSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        DVS / operator staff session (RBAC, least privilege). Distinct from the
        integrator `operatorApiKey` used on the client API — control-plane actions are
        never authorised by an integrator key.

  responses:
    Unauthorized:
      description: Missing or invalid admin session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicting state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ZoneWrite:
      type: object
      required: [zone_code, zone_name, zone_type, movement_restriction, effective_from]
      properties:
        zone_code: { type: string, examples: [ZW-FMD-RED-SE] }
        zone_name: { type: string }
        zone_type: { type: string, enum: [fmd_free, fmd_protection, fmd_infected, surveillance] }
        movement_restriction: { type: string, enum: [none, restricted, blocked] }
        boundary_wkt: { type: [string, 'null'] }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
        source_reference: { type: string, description: Gazette / Statutory Instrument reference. }
      additionalProperties: false

    Zone:
      type: object
      required: [zone_code, zone_type, movement_restriction, zone_version, status]
      properties:
        zone_code: { type: string }
        zone_name: { type: string }
        zone_type: { type: string, enum: [fmd_free, fmd_protection, fmd_infected, surveillance] }
        movement_restriction: { type: string, enum: [none, restricted, blocked] }
        boundary_wkt: { type: [string, 'null'] }
        zone_version: { type: integer, format: int64 }
        status: { type: string, enum: [draft, active, expired] }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
        source_reference: { type: string }

    IntegratorCreate:
      type: object
      required: [name, contact_email]
      properties:
        name: { type: string, examples: [FuroTrack] }
        contact_email: { type: string, format: email }
      additionalProperties: false

    Integrator:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        contact_email: { type: string, format: email }
        status: { type: string, enum: [accredited, suspended] }
        accredited_at: { type: string, format: date-time }

    ApiKey:
      type: object
      required: [key_id, integrator_id, status]
      properties:
        key_id: { type: string }
        integrator_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }

    ApiKeyIssued:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The bearer token. Shown once on issue/rotate; never retrievable again.

    AuditEntry:
      type: object
      required: [id, at, actor, action]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, description: Admin user / operator who performed the action. }
        action: { type: string, examples: [zone.declare, key.issue, certificate.revoke] }
        target_type: { type: string }
        target_id: { type: string }
        details:
          type: object
          additionalProperties: true

    Revocation:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    Certificate:
      type: object
      required: [id, kind, reference, status]
      properties:
        id: { type: string }
        kind: { type: string }
        reference: { type: string }
        status: { type: string, enum: [requested, issued, revoked, superseded, expired] }
        subject_type: { type: string }
        subject_id: { type: string }
        issued_at: { type: [string, 'null'] }
        valid_until: { type: [string, 'null'] }
        signing_key_id: { type: [string, 'null'] }
        signature: { type: [string, 'null'] }
        verify_url: { type: [string, 'null'] }
        pdf_url: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'] }
        revocation_reason: { type: [string, 'null'] }

    Movement:
      type: object
      required: [permit_reference, status]
      properties:
        permit_reference: { type: string }
        status: { type: string }
